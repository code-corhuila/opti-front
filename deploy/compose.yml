# The container: only opti-front and opti-api-gateway publish a port to the host.
name: opti-front

services:
  front:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: opti/front:local
    environment:
      GATEWAY_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:8000}
    networks:
      - platform
    expose:
      - "80"
    restart: unless-stopped

networks:
  platform:
    external: true
